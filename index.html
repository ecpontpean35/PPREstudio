<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PPRE Studio Pro</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f5f7fb;
}

.app{
  display:grid;
  grid-template-columns: 300px 1fr 1fr;
  height:100vh;
}

/* PANELS */
.panel{
  padding:16px;
  overflow:auto;
  background:white;
  border-right:1px solid #e5e7eb;
}

/* TITRES */
h2{
  font-size:13px;
  color:#6b7280;
  text-transform:uppercase;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:1px solid #d1d5db;
  border-radius:8px;
}

/* BOUTONS */
button{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.btn{
  background:#2563eb;
  color:white;
}

/* ÉLÈVES */
.student{
  padding:10px;
  border:1px solid #e5e7eb;
  border-radius:8px;
  margin-top:6px;
  cursor:pointer;
}

.student.active{
  background:#dbeafe;
  border:2px solid #2563eb;
}

/* COMPÉTENCES */
.skill{
  margin-bottom:16px;
}

.skill-title{
  font-weight:600;
  margin-bottom:6px;
}

.levels{
  display:flex;
  flex-wrap:wrap;
}

.levels button{
  width:32%;
  margin:2px 1%;
  background:#e5e7eb;
  font-size:12px;
  border-radius:6px;
}

.levels button.active{
  background:#2563eb;
  color:white;
}

/* OUTPUT */
.output{
  white-space:pre-line;
  padding:10px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:8px;
}

</style>
</head>

<body>

<div class="app">

<!-- ================= ÉLÈVES ================= -->
<div class="panel">
<h2>Classe</h2>

<input id="name" placeholder="Nom élève">
<button class="btn" onclick="addStudent()">Ajouter élève</button>

<div id="list"></div>
</div>

<!-- ================= COMPÉTENCES ================= -->
<div class="panel">
<h2>Compétences</h2>

<div class="skill" data-skill="lecture">
<div class="skill-title">Lecture</div>
<div class="levels">
<button onclick="setLevel('lecture',1)">N1</button>
<button onclick="setLevel('lecture',2)">N2</button>
<button onclick="setLevel('lecture',3)">N3</button>
<button onclick="setLevel('lecture',4)">N4</button>
<button onclick="setLevel('lecture',5)">N5</button>
<button onclick="setLevel('lecture',6)">N6</button>
</div>
</div>

<div class="skill" data-skill="ecriture">
<div class="skill-title">Écriture</div>
<div class="levels">
<button onclick="setLevel('ecriture',1)">N1</button>
<button onclick="setLevel('ecriture',2)">N2</button>
<button onclick="setLevel('ecriture',3)">N3</button>
<button onclick="setLevel('ecriture',4)">N4</button>
<button onclick="setLevel('ecriture',5)">N5</button>
<button onclick="setLevel('ecriture',6)">N6</button>
</div>
</div>

<div class="skill" data-skill="attention">
<div class="skill-title">Attention</div>
<div class="levels">
<button onclick="setLevel('attention',1)">N1</button>
<button onclick="setLevel('attention',2)">N2</button>
<button onclick="setLevel('attention',3)">N3</button>
<button onclick="setLevel('attention',4)">N4</button>
<button onclick="setLevel('attention',5)">N5</button>
<button onclick="setLevel('attention',6)">N6</button>
</div>
</div>

<button class="btn" onclick="generate()">Générer PPRE</button>
</div>

<!-- ================= RESULTAT ================= -->
<div class="panel">
<h2>PPRE</h2>

<div id="title">Aucun élève sélectionné</div>
<br>
<div id="out" class="output">...</div>
</div>

</div>

<script>

let students = [];
let selected = null;

let levels = {
  lecture:null,
  ecriture:null,
  attention:null
};

/* AJOUT ÉLÈVE */
function addStudent(){
  let n = document.getElementById("name").value;
  if(!n) return;

  students.push(n);
  document.getElementById("name").value="";
  render();
}

/* LISTE */
function render(){
  document.getElementById("list").innerHTML =
    students.map((s,i)=>
      `<div class="student ${selected===i?'active':''}" onclick="select(${i})">
        ${s}
      </div>`
    ).join("");
}

/* SÉLECTION */
function select(i){
  selected = i;
  document.getElementById("title").innerText = students[i];
  render();
}

/* NIVEAUX (CORRIGÉ — PLUS DE BUG 2e DOMAINE) */
function setLevel(skill, level){

  levels[skill] = level;

  document.querySelectorAll(`[data-skill="${skill}"] button`)
    .forEach((btn, i) => {
      btn.classList.remove("active");
      if(i === level - 1){
        btn.classList.add("active");
      }
    });
}

/* GÉNÉRATION */
function generate(){

  if(selected === null) return;

  let s = students[selected];

  let text = `PPRE – ${s}\n\n`;

  if(levels.lecture){
    text += "Lecture : N" + levels.lecture + "\n";
  }
  if(levels.ecriture){
    text += "Écriture : N" + levels.ecriture + "\n";
  }
  if(levels.attention){
    text += "Attention : N" + levels.attention + "\n";
  }

  document.getElementById("out").innerText = text;
}

</script>

</body>
</html>
