<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PPRE Studio Pro</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f7fb;
  color:#1f2937;
}

.app{
  display:grid;
  grid-template-columns: 300px 1fr 1fr;
  height:100vh;
}

/* PANELS */
.panel{
  padding:16px;
  overflow:auto;
  background:white;
}

.left{
  border-right:1px solid #e5e7eb;
}

.center{
  border-right:1px solid #e5e7eb;
}

/* TITRES */
h2{
  font-size:14px;
  text-transform:uppercase;
  color:#6b7280;
  margin-top:0;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:8px;
  margin-bottom:10px;
}

/* BOUTONS */
button{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.btn{
  background:#2563eb;
  color:white;
}

.btn:hover{
  background:#1d4ed8;
}

/* ÉLÈVES */
.student{
  padding:10px;
  border:1px solid #e5e7eb;
  border-radius:8px;
  margin-top:6px;
  cursor:pointer;
}

.student:hover{
  background:#f3f4f6;
}

/* COMPÉTENCES */
.skill{
  padding:10px;
  border:1px solid #e5e7eb;
  border-radius:8px;
  margin-bottom:10px;
}

.levels button{
  width:48%;
  margin:2px 1%;
  background:#e5e7eb;
  color:#111827;
  font-size:12px;
}

.levels button.active{
  background:#2563eb;
  color:white;
}

/* OUTPUT */
.output{
  white-space:pre-line;
  background:#f9fafb;
  padding:12px;
  border-radius:8px;
  border:1px solid #e5e7eb;
}
</style>
</head>

<body>

<div class="app">

<!-- ================= LEFT ================= -->
<div class="panel left">
<h2>Classe</h2>

<input id="name" placeholder="Nom élève">
<button class="btn" onclick="addStudent()">+ Ajouter élève</button>

<div id="list"></div>
</div>

<!-- ================= CENTER ================= -->
<div class="panel center">
<h2>Compétences + niveaux</h2>

<div class="skill">
<b>Lecture</b>
<div class="levels">
<button onclick="setLevel('lecture',1)">N1</button>
<button onclick="setLevel('lecture',2)">N2</button>
<button onclick="setLevel('lecture',3)">N3</button>
<button onclick="setLevel('lecture',4)">N4</button>
<button onclick="setLevel('lecture',5)">N5</button>
<button onclick="setLevel('lecture',6)">N6</button>
</div>
</div>

<div class="skill">
<b>Écriture</b>
<div class="levels">
<button onclick="setLevel('ecriture',1)">N1</button>
<button onclick="setLevel('ecriture',2)">N2</button>
<button onclick="setLevel('ecriture',3)">N3</button>
<button onclick="setLevel('ecriture',4)">N4</button>
<button onclick="setLevel('ecriture',5)">N5</button>
<button onclick="setLevel('ecriture',6)">N6</button>
</div>
</div>

<div class="skill">
<b>Attention</b>
<div class="levels">
<button onclick="setLevel('attention',1)">N1</button>
<button onclick="setLevel('attention',2)">N2</button>
<button onclick="setLevel('attention',3)">N3</button>
<button onclick="setLevel('attention',4)">N4</button>
<button onclick="setLevel('attention',5)">N5</button>
<button onclick="setLevel('attention',6)">N6</button>
</div>
</div>

<button class="btn" onclick="generate()">Générer PPRE</button>
</div>

<!-- ================= RIGHT ================= -->
<div class="panel right">
<h2>Document PPRE</h2>

<div id="title">Aucun élève</div>
<br>
<div id="out" class="output">Sélectionner un élève</div>
</div>

</div>

<script>

let students = [];
let selected = null;

let levels = {
  lecture: null,
  ecriture: null,
  attention: null
};

/* AJOUT ÉLÈVE */
function addStudent(){
  let n = document.getElementById("name").value;
  if(!n) return;
  students.push(n);
  document.getElementById("name").value="";
  render();
}

/* LISTE */
function render(){
  document.getElementById("list").innerHTML =
    students.map((s,i)=>
      `<div class="student" onclick="select(${i})">${s}</div>`
    ).join("");
}

/* SELECTION */
function select(i){
  selected = i;
  document.getElementById("title").innerText = students[i];
}

/* NIVEAU */
function setLevel(skill, level){
  levels[skill] = level;
}

/* MOTEUR SIMPLE */
function generate(){

  if(selected === null) return;

  let text = `PPRE – ${students[selected]}\n\n`;

  if(levels.lecture){
    text += `Lecture (N${levels.lecture})\n`;
    text += getAction("lecture", levels.lecture) + "\n\n";
  }

  if(levels.ecriture){
    text += `Écriture (N${levels.ecriture})\n`;
    text += getAction("ecriture", levels.ecriture) + "\n\n";
  }

  if(levels.attention){
    text += `Attention (N${levels.attention})\n`;
    text += getAction("attention", levels.attention) + "\n\n";
  }

  document.getElementById("out").innerText = text;
}

/* RÈGLES PÉDAGOGIQUES SIMPLES */
function getAction(skill, level){

  const map = {
    lecture: [
      "repérer des mots isolés",
      "lire des phrases simples",
      "comprendre un texte court",
      "inférer des informations simples",
      "comprendre l’implicite",
      "analyser un texte complexe"
    ],
    ecriture: [
      "tracer les lettres",
      "écrire des mots",
      "écrire des phrases simples",
      "structurer un paragraphe",
      "argumenter",
      "produire un texte structuré"
    ],
    attention: [
      "se concentrer 5 min",
      "suivre une consigne simple",
      "maintenir l’attention",
      "gérer une tâche longue",
      "auto-régulation",
      "autonomie complète"
    ]
  };

  return "Objectif : " + map[skill][level-1];
}

</script>

</body>
</html>
