<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PPRE Studio</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#0f172a;
  color:white;
}

.container{
  display:flex;
  height:100vh;
}

.panel{
  padding:10px;
  overflow:auto;
}

.left{width:30%; background:#111827;}
.right{flex:1; background:#1f2937;}

input,button{
  width:100%;
  padding:6px;
  margin-top:5px;
}

.student{
  background:#374151;
  padding:6px;
  margin-top:5px;
  cursor:pointer;
}

.student:hover{
  background:#4b5563;
}

.output{
  white-space:pre-line;
}
</style>
</head>

<body>

<div class="container">

<div class="panel left">
<h3>Élèves</h3>

<input id="name" placeholder="Nom élève">
<button onclick="addStudent()">Ajouter</button>

<div id="list"></div>

<hr>

<h4>Difficultés</h4>
<label><input type="checkbox" value="lecture"> Lecture</label><br>
<label><input type="checkbox" value="écriture"> Écriture</label><br>
<label><input type="checkbox" value="attention"> Attention</label><br>
<label><input type="checkbox" value="vocabulaire"> Vocabulaire</label><br>
<label><input type="checkbox" value="oral"> Oral</label><br>

<button onclick="generatePPRE()">Générer PPRE</button>
<button onclick="generateFamily()">Fiche famille</button>
</div>

<div class="panel right">
<h3 id="title">Aucun élève</h3>
<pre id="out" class="output"></pre>
</div>

</div>

<script>

let students = [];
let selected = null;

function addStudent(){
  let n = document.getElementById("name").value;
  if(!n) return;
  students.push(n);
  document.getElementById("name").value = "";
  render();
}

function render(){
  document.getElementById("list").innerHTML =
    students.map((s,i)=>
      `<div class="student" onclick="select(${i})">${s}</div>`
    ).join("");
}

function select(i){
  selected = i;
  document.getElementById("title").innerText = students[i];
}

function checked(){
  return [...document.querySelectorAll("input[type=checkbox]")]
    .filter(c=>c.checked)
    .map(c=>c.value);
}

function generatePPRE(){
  if(selected===null) return;

  let d = checked();

  document.getElementById("out").innerText =
`PPRE

Élève : ${students[selected]}

Difficultés :
- ${d.join("\n- ")}

Objectifs :
- adapter les tâches
- renforcer les compétences ciblées`;
}

function generateFamily(){
  if(selected===null) return;

  let d = checked();

  document.getElementById("out").innerText =
`FICHE FAMILLE

Élève : ${students[selected]}

Difficultés :
- ${d.join("\n- ")}

Conseils :
- lecture quotidienne
- reformulation
- encouragement`;
}

</script>

</body>
</html>
