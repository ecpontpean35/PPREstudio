<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PPRE Studio</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #0f172a;
  color: white;
}

.container {
  display: flex;
  height: 100vh;
}

.panel {
  padding: 10px;
}

.left {
  width: 25%;
  background: #111827;
}

.center {
  width: 30%;
  background: #1f2937;
}

.right {
  flex: 1;
  background: #0b1220;
}

input, button {
  width: 100%;
  padding: 6px;
  margin-top: 5px;
}

.student {
  background: #374151;
  padding: 6px;
  margin-top: 5px;
  cursor: pointer;
}

.output {
  white-space: pre-line;
}
</style>

</head>

<body>

<div class="container">

<!-- GAUCHE -->
<div class="panel left">
<h3>Élèves</h3>

<input id="name" placeholder="Nom élève">
<button onclick="addStudent()">Ajouter</button>

<div id="students"></div>
</div>

<!-- CENTRE -->
<div class="panel center">
<h3>Difficultés</h3>

<label><input type="checkbox" value="lecture"> Lecture</label><br>
<label><input type="checkbox" value="écriture"> Écriture</label><br>
<label><input type="checkbox" value="attention"> Attention</label><br>
<label><input type="checkbox" value="vocabulaire"> Vocabulaire</label><br>
<label><input type="checkbox" value="oral"> Oral</label><br>

<button onclick="generatePPRE()">Générer PPRE</button>
<button onclick="generateFamily()">Fiche famille</button>
</div>

<!-- DROITE -->
<div class="panel right">
<h3 id="title">Aucun élève</h3>
<div id="output" class="output"></div>
</div>

</div>

<script>

let students = [];
let selected = null;

function addStudent(){
  let name = document.getElementById("name").value;
  if(!name) return;

  students.push({name:name});
  document.getElementById("name").value = "";
  render();
}

function render(){
  let box = document.getElementById("students");
  box.innerHTML = "";

  students.forEach((s,i)=>{
    box.innerHTML += `
      <div class="student" onclick="select(${i})">
        ${s.name}
      </div>
    `;
  });
}

function select(i){
  selected = i;
  document.getElementById("title").innerText = students[i].name;
}

function getChecked(){
  let checks = document.querySelectorAll("input[type=checkbox]");
  let res = [];
  checks.forEach(c=>{
    if(c.checked) res.push(c.value);
  });
  return res;
}

function generatePPRE(){
  if(selected === null) return;

  let s = students[selected];
  let diff = getChecked();

  let obj = [];

  if(diff.includes("lecture")) obj.push("Comprendre les textes");
  if(diff.includes("écriture")) obj.push("Améliorer l’écriture");
  if(diff.includes("attention")) obj.push("Rester concentré");
  if(diff.includes("vocabulaire")) obj.push("Enrichir le lexique");
  if(diff.includes("oral")) obj.push("S’exprimer à l’oral");

  document.getElementById("output").innerText =
`PPRE

Élève : ${s.name}

Objectifs :
- ${obj.join("\n- ")}`;
}

function generateFamily(){
  if(selected === null) return;

  let s = students[selected];
  let diff = getChecked();

  document.getElementById("output").innerText =
`FICHE FAMILLE

Élève : ${s.name}

Difficultés :
- ${diff.join("\n- ")}

Conseils :
- lecture quotidienne
- reformulation
- encouragement`;
}

render();

</script>

</body>
</html>
