<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PPRE Studio v9 FIX</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f3f4f6;
}

.app{
  display:grid;
  grid-template-columns:300px 1fr;
  height:100vh;
}

.panel{
  background:white;
  border-right:1px solid #ddd;
  padding:10px;
  overflow:auto;
}

textarea{
  width:100%;
  height:300px;
}

button{
  width:100%;
  padding:8px;
  margin-top:8px;
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}

pre{
  white-space:pre-wrap;
  font-size:12px;
}
</style>
</head>

<body>

<div class="app">

<!-- LEFT -->
<div class="panel">
<h3>📥 Coller référentiel</h3>

<textarea id="input"></textarea>

<button onclick="load()">Charger le référentiel</button>

</div>

<!-- RIGHT -->
<div class="panel">
<h3>📘 Affichage</h3>

<pre id="out">Aucun contenu chargé</pre>

</div>

</div>

<script>

function load(){
let text=document.getElementById("input").value;
document.getElementById("out").innerText=text;
}

</script>

</body>
</html>
