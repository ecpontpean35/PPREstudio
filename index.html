<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PPRE Studio v13 – multi-matières</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f3f4f6;
}

.container{
  display:grid;
  grid-template-columns:320px 360px 1fr;
  height:100vh;
}

.panel{
  background:white;
  border-right:1px solid #ddd;
  padding:10px;
  overflow:auto;
}

h3{
  margin-top:10px;
  font-size:13px;
}

.item{
  padding:6px;
  border:1px solid #e5e7eb;
  margin:4px 0;
  cursor:pointer;
  border-radius:5px;
}

.item:hover{
  background:#dbeafe;
}

.selected{
  background:#93c5fd;
}

.output{
  white-space:pre-wrap;
  font-size:13px;
  background:#f9fafb;
  padding:10px;
  border:1px solid #e5e7eb;
}

button{
  width:100%;
  padding:8px;
  margin-top:6px;
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<!-- ================= ELEVES ================= -->
<div class="panel">
<h3>Élèves</h3>

<input id="student" placeholder="Nom élève">
<button onclick="addStudent()">Ajouter</button>

<div id="students"></div>
</div>

<!-- ================= REFERENTIEL ================= -->
<div class="panel">
<h3>Référentiel</h3>

<div id="ref"></div>
</div>

<!-- ================= PPRE ================= -->
<div class="panel">
<h3>PPRE</h3>

<button onclick="generate()">Générer PPRE</button>

<div class="output" id="out">Aucun PPRE</div>
</div>

</div>

<script>

let students=[];
let selectedStudent=null;
let selectedItems=[];

/* ================= ELEVES ================= */

function addStudent(){
let v=document.getElementById("student").value;
if(!v) return;
students.push(v);
document.getElementById("student").value="";
renderStudents();
}

function renderStudents(){
document.getElementById("students").innerHTML=
students.map((s,i)=>
`<div class="item" onclick="selectedStudent=${i}">${s}</div>`
).join("");
}

/* ================= REFERENTIEL COMPLET ================= */

const referentiel = {

"FRANÇAIS – Écriture":{
"Motricité fine":[
"tenue du crayon",
"gestes saccadés",
"coordination œil-main"
],
"Posture":[
"position corporelle",
"placement de la feuille"
],
"Lisibilité":[
"formation des lettres",
"espacement",
"inclinaison"
],
"Vitesse":[
"écriture lente",
"écriture précipitée"
],
"Fatigabilité":[
"fatigue rapide",
"douleurs"
],
"Organisation spatiale":[
"organisation de la page",
"repérage visuel"
]
},

"FRANÇAIS – Lecture":{
"Fluence":[
"lecture lente",
"décodage hésitant"
],
"Compréhension":[
"compréhension implicite fragile",
"repérage informations"
]
},

"MATHS":{
"Numération":[
"difficultés de dénombrement",
"confusion unités/dizaines"
],
"Calcul":[
"calcul lent",
"erreurs de procédure"
],
"Problèmes":[
"difficulté de compréhension énoncé"
]
},

"MÉTHODOLOGIE":{
"Attention":[
"distractibilité",
"difficulté de maintien"
],
"Organisation":[
"oubli du matériel",
"désorganisation"
],
"Mémoire":[
"difficulté de mémorisation"
]
}

};

/* ================= AFFICHAGE ================= */

function renderRef(){
let html="";

for(let domaine in referentiel){
html+=`<h3>${domaine}</h3>`;

for(let cat in referentiel[domaine]){
html+=`<strong>${cat}</strong>`;

referentiel[domaine][cat].forEach(item=>{
html+=`
<div class="item ${selectedItems.includes(item)?'selected':''}"
onclick="toggle(this,'${item}')">
${item}
</div>`;
});
}
}

document.getElementById("ref").innerHTML=html;
}

function toggle(el,item){

if(selectedItems.includes(item)){
selectedItems = selectedItems.filter(x=>x!==item);
el.classList.remove("selected");
}else{
selectedItems.push(item);
el.classList.add("selected");
}

}

/* initial */
renderRef();

/* ================= PPRE ================= */

function generate(){

if(selectedStudent===null){
alert("Choisir élève");
return;
}

let name = students[selectedStudent];

let text = "PPRE – " + name + "\n\n";

text += "DIFFICULTÉS :\n";
selectedItems.forEach(i=>text+="- "+i+"\n");

text += "\nOBJECTIFS :\n";
selectedItems.forEach(i=>{
text+="- améliorer " + i + "\n";
});

text += "\nAIDES :\n";
selectedItems.forEach(i=>{
text+="- entraînement ciblé sur " + i + "\n";
});

document.getElementById("out").innerText=text;

}

</script>

</body>
</html>
