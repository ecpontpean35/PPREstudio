<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TEST PPRE</title>
</head>

<body>

<h2>PPRE TEST</h2>

<input id="name" placeholder="Nom élève">
<button onclick="add()">Ajouter</button>

<div id="list"></div>

<button onclick="run()">TEST GENERER</button>

<div id="out"></div>

<script>

let students = [];

function add(){
  let n = document.getElementById("name").value;
  students.push(n);
  document.getElementById("name").value = "";
  render();
}

function render(){
  document.getElementById("list").innerHTML =
    students.map(s => "<div>"+s+"</div>").join("");
}

function run(){
  document.getElementById("out").innerText =
    "Élèves : " + students.join(", ");
}

</script>

</body>
</html>
