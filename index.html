<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PPRE Studio – Import DOCX</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f3f4f6;
}

.container{
  display:grid;
  grid-template-columns:300px 1fr;
  height:100vh;
}

.panel{
  padding:10px;
  overflow:auto;
  background:white;
  border-right:1px solid #ddd;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}

pre{
  white-space:pre-wrap;
  font-size:13px;
}

input{
  width:100%;
}
</style>

</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="panel">
<h3>📁 Charger ton référentiel</h3>

<p>Importer ton fichier Word (.docx)</p>

<input type="file" id="file">

<button onclick="loadFile()">Afficher le contenu</button>

</div>

<!-- RIGHT -->
<div class="panel">
<h3>📘 Référentiel affiché</h3>

<pre id="out">Aucun fichier chargé</pre>

</div>

</div>

<script>

async function loadFile(){

const file = document.getElementById('file').files[0];

if(!file){
alert("Choisis un fichier .docx");
return;
}

const text = await file.text();

document.getElementById("out").innerText =
"⚠️ Le fichier est chargé mais brut :\n\n" + text;

}

</script>

</body>
</html>
