<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PPRE Studio</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#0f172a;
  color:white;
}

.container{
  display:flex;
  height:100vh;
}

.panel{
  padding:10px;
  overflow:auto;
}

.left{width:25%; background:#111827;}
.center{width:30%; background:#1f2937;}
.right{flex:1; background:#0b1220;}

input,button{
  width:100%;
  padding:6px;
  margin-top:5px;
}

.student{
  background:#374151;
  padding:6px;
  margin-top:5px;
  cursor:pointer;
}

.student:hover{
  background:#4b5563;
}

.output{
  white-space:pre-line;
}
</style>
</head>

<body>

<div class="container">

<div class="panel left">
<h3>Élèves</h3>
<input id="name" placeholder="Nom élève">
<button onclick="addStudent()">Ajouter</button>
<div id="list"></div>
</div>

<div class="panel center">
<h3>Difficultés</h3>

<label><input type="checkbox" value="lecture"> Lecture</label><br>
<label><input type="checkbox" value="écriture"> Écriture</label><br>
<label><input type="checkbox" value="attention"> Attention</label><br>
<label><input type="checkbox" value="vocabulaire"> Vocabulaire</label><br>
<label><input type="checkbox" value="oral"> Oral</label><br>

<button onclick="generatePPRE()">Générer PPRE</button>
<button onclick="generateFamily()">Fiche famille</button>
</div>

<div class="panel right">
<h3 id="title">Aucun élève</h3>
<div id="out" class="output"></div>
</div>

</div>

<script>

let students=[];
let selected=null;

function addStudent(){
  let n=document.getElementById("name").value;
  if(!n) return;
  students.push({name:n});
  document.getElementById("name").value="";
  render();
}

function render(){
  document.getElementById("list").innerHTML =
    students.map((s,i)=>
      `<div class="student" onclick="select(${i})">${s.name}</div>`
    ).join("");
}

function select(i){
  selected=i;
  document.getElementById("title").innerText=students[i].name;
}

function checked(){
  return [...document.querySelectorAll("input[type=checkbox]")]
    .filter(c=>c.checked)
    .map(c=>c.value);
}

function generatePPRE(){
  if(selected===null) return;

  let s=students[selected];
  let d=checked();

  let obj=[];
  if(d.includes("lecture")) obj.push("Comprendre un texte simple");
  if(d.includes("écriture")) obj.push("Améliorer l’écriture");
  if(d.includes("attention")) obj.push("Maintenir l’attention");
  if(d.includes("vocabulaire")) obj.push("Enrichir le lexique");
  if(d.includes("oral")) obj.push("S’exprimer à l’oral");

  document.getElementById("out").innerText=
`PPRE

Élève : ${s.name}

Objectifs :
- ${obj.join("\n- ")}`;
}

function generateFamily(){
  if(selected===null) return;

  let s=students[selected];
  let d=checked();

  document.getElementById("out").innerText=
`FICHE FAMILLE

Élève : ${s.name}

Difficultés :
- ${d.join("\n- ")}

Conseils :
- lecture quotidienne
- reformulation
- encouragement`;
}

  <script>
  alert("JS CHARGE")  
  </script>
</body>
</html>
