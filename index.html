<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PPRE Studio Pro</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f5f7fb;
}

.app{
  display:grid;
  grid-template-columns: 300px 1fr 1fr;
  height:100vh;
}

/* PANELS */
.panel{
  padding:16px;
  overflow:auto;
  background:white;
  border-right:1px solid #e5e7eb;
}

h2{
  font-size:13px;
  color:#6b7280;
  text-transform:uppercase;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:1px solid #d1d5db;
  border-radius:8px;
}

/* BOUTONS */
button{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.btn{
  background:#2563eb;
  color:white;
}

/* ÉLÈVES */
.student{
  padding:10px;
  border:1px solid #e5e7eb;
  border-radius:8px;
  margin-top:6px;
  cursor:pointer;
}

.student.active{
  background:#dbeafe;
  border:2px solid #2563eb;
}

/* COMPÉTENCES */
.skill{
  margin-bottom:16px;
}

.skill-title{
  font-weight:600;
  margin-bottom:6px;
}

.levels{
  display:flex;
  flex-wrap:wrap;
}

.levels button{
  width:32%;
  margin:2px 1%;
  background:#e5e7eb;
  font-size:12px;
  border-radius:6px;
}

.levels button.active{
  background:#2563eb;
  color:white;
}

/* OUTPUT */
.output{
  white-space:pre-line;
  padding:10px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:8px;
}

</style>
</head>

<body>

<div class="app">

<!-- ================= ÉLÈVES ================= -->
<div class="panel">
<h2>Classe</h2>

<input id="name" placeholder="Nom élève">
<button class="btn" onclick="addStudent()">Ajouter élève</button>

<div id="list"></div>
</div>

<!-- ================= COMPÉTENCES ================= -->
<div class="panel">
<h2>Compétences</h2>

<div class="skill" data-skill="lecture">
<div class="skill-title">Lecture</div>
<div class="levels">
<button onclick="setLevel('lecture',1)">N1</button>
<button onclick="setLevel('lecture',2)">N2</button>
<button onclick="setLevel('lecture',3)">N3</button>
<button onclick="setLevel('lecture',4)">N4</button>
<button onclick="setLevel('lecture',5)">N5</button>
<button onclick="setLevel('lecture',6)">N6</button>
</div>
</div>

<div class="skill" data-skill="ecriture">
<div class="skill-title">Écriture</div>
<div class="levels">
<button onclick="setLevel('ecriture',1)">N1</button>
<button onclick="setLevel('ecriture',2)">N2</button>
<button onclick="setLevel('ecriture',3)">N3</button>
<button onclick="setLevel('ecriture',4)">N4</button>
<button onclick="setLevel('ecriture',5)">N5</button>
<button onclick="setLevel('ecriture',6)">N6</button>
</div>
</div>

<div class="skill" data-skill="attention">
<div class="skill-title">Attention</div>
<div class="levels">
<button onclick="setLevel('attention',1)">N1</button>
<button onclick="setLevel('attention',2)">N2</button>
<button onclick="setLevel('attention',3)">N3</button>
<button onclick="setLevel('attention',4)">N4</button>
<button onclick="setLevel('attention',5)">N5</button>
<button onclick="setLevel('attention',6)">N6</button>
</div>
</div>

<button class="btn" onclick="generate()">Générer PPRE</button>
</div>

<!-- ================= RESULTAT ================= -->
<div class="panel">
<h2>PPRE généré</h2>

<div id="title">Aucun élève</div>
<br>
<div id="out" class="output">...</div>
</div>

</div>

<script>

let students = [];
let selected = null;

let levels = {
  lecture:null,
  ecriture:null,
  attention:null
};

/* ================= ÉLÈVES ================= */
function addStudent(){
  let n = document.getElementById("name").value;
  if(!n) return;

  students.push(n);
  document.getElementById("name").value="";
  render();
}

function render(){
  document.getElementById("list").innerHTML =
    students.map((s,i)=>
      `<div class="student ${selected===i?'active':''}" onclick="select(i=${i})">
        ${s}
      </div>`
    ).join("");
}

function select(i){
  selected = i;
  document.getElementById("title").innerText = students[i];
  render();
}

/* ================= NIVEAUX ================= */
function setLevel(skill, level){

  levels[skill] = level;

  document.querySelectorAll(`[data-skill="${skill}"] button`)
    .forEach((btn, i) => {
      btn.classList.remove("active");
      if(i === level-1) btn.classList.add("active");
    });
}

/* ================= MOTEUR PPRE COMPLET ================= */
const engine = {
  lecture: {
    1: {
      obj:["Identifier des éléments isolés","Comprendre du vocabulaire simple"],
      aid:["textes très courts","illustrations","guidage fort"]
    },
    2: {
      obj:["Repérer informations explicites","Comprendre phrases simples"],
      aid:["surlignage guidé","questions fermées","reformulation"]
    },
    3: {
      obj:["Comprendre texte court","Faire inférences simples"],
      aid:["lecture accompagnée","questions guidées"]
    },
    4: {
      obj:["Comprendre texte structuré","Relever informations clés"],
      aid:["lecture autonome guidée","questionnement ciblé"]
    },
    5: {
      obj:["Analyser un texte","Interpréter implicite simple"],
      aid:["analyse guidée","mise en réseau des idées"]
    },
    6: {
      obj:["Comprendre textes complexes","Argumenter à l’écrit"],
      aid:["travail autonome","analyse fine"]
    }
  },

  ecriture: {
    1:{obj:["Tracer lettres"],aid:["modèles agrandis","guidage geste"]},
    2:{obj:["Écrire mots"],aid:["dictée à l’adulte","modèles"]},
    3:{obj:["Écrire phrases"],aid:["banque de mots","guidage syntaxe"]},
    4:{obj:["Produire paragraphes"],aid:["plans guidés","structure texte"]},
    5:{obj:["Structurer texte"],aid:["aide organisation","relecture guidée"]},
    6:{obj:["Produire texte long"],aid:["autonomie","critique texte"]}
  },

  attention: {
    1:{obj:["Maintenir attention courte durée"],aid:["consignes courtes","timer"]},
    2:{obj:["Suivre consigne simple"],aid:["fractionnement","rappels"]},
    3:{obj:["Maintenir effort"],aid:["objectifs courts","encouragement"]},
    4:{obj:["Gérer tâche longue"],aid:["planning visuel"]},
    5:{obj:["Auto-régulation"],aid:["autonomie guidée"]},
    6:{obj:["Autonomie complète"],aid:["responsabilisation"]}
  }
};

/* ================= GENERATION PPRE ================= */
function generate(){

  if(selected === null) return;

  let name = students[selected];
  let text = `PPRE – ${name}\n\n`;

  Object.keys(levels).forEach(skill => {

    let lvl = levels[skill];

    if(lvl && engine[skill] && engine[skill][lvl]){

      let data = engine[skill][lvl];

      text += "=== " + skill.toUpperCase() + " ===\n\n";

      text += "Objectifs :\n";
      data.obj.forEach(o => text += "- " + o + "\n");

      text += "\nAides :\n";
      data.aid.forEach(a => text += "- " + a + "\n");

      text += "\n\n";
    }
  });

  document.getElementById("out").innerText = text;
}

</script>

</body>
</html>
