<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PPRE Studio – Assistant Inspection</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f3f4f6;
}

.app{
  display:grid;
  grid-template-columns:260px 360px 1fr 1fr;
  height:100vh;
}

/* PANELS */
.panel{
  background:white;
  border-right:1px solid #e5e7eb;
  padding:14px;
  overflow:auto;
}

h2{
  font-size:12px;
  color:#6b7280;
  text-transform:uppercase;
}

/* INPUT */
input{
  width:100%;
  padding:8px;
  border:1px solid #d1d5db;
  border-radius:6px;
  margin-bottom:8px;
}

button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:6px;
}

.primary{
  background:#2563eb;
  color:white;
}

.secondary{
  background:#e5e7eb;
}

/* ELEVE */
.student{
  padding:8px;
  border:1px solid #e5e7eb;
  margin-top:6px;
  border-radius:6px;
  cursor:pointer;
}

.student.active{
  background:#dbeafe;
  border:2px solid #2563eb;
}

/* BLOCS */
.block-title{
  font-weight:bold;
  margin:10px 0 6px;
}

/* CHECKBOX */
label{
  display:block;
  font-size:13px;
  margin:4px 0;
}

/* OUTPUT */
.output{
  white-space:pre-line;
  padding:10px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:6px;
  font-size:13px;
}

</style>
</head>

<body>

<div class="app">

<!-- ================= ELEVES ================= -->
<div class="panel">

<h2>Élèves</h2>

<input id="name" placeholder="Nom élève">
<button class="primary" onclick="addStudent()">Ajouter</button>

<div id="students"></div>

</div>

<!-- ================= ANALYSE ================= -->
<div class="panel">

<h2>Analyse</h2>

<div class="block-title">Compétences</div>

<select id="skill" onchange="loadLevelOptions()">
<option value="">-- choisir --</option>
<option value="lecture">Lecture</option>
<option value="comprehension">Compréhension</option>
<option value="ecriture">Écriture</option>
<option value="maths">Maths</option>
<option value="attention">Attention</option>
</select>

<div class="block-title">Niveau estimé</div>

<select id="level" onchange="showSuggestions()">
<option value="">-- niveau --</option>
<option value="1">N1</option>
<option value="2">N2</option>
<option value="3">N3</option>
<option value="4">N4</option>
<option value="5">N5</option>
<option value="6">N6</option>
</select>

</div>

<!-- ================= SELECTION PROF ================= -->
<div class="panel">

<h2>Décision enseignant</h2>

<div class="block-title">Difficultés observées</div>
<div id="difficulties"></div>

<div class="block-title">Objectifs retenus</div>
<div id="objectives"></div>

<div class="block-title">Aides choisies</div>
<div id="aids"></div>

<button class="primary" onclick="generate()">Générer PPRE</button>
<button class="secondary" onclick="generateFamily()">Fiche famille</button>

</div>

<!-- ================= OUTPUT ================= -->
<div class="panel">

<h2>PPRE</h2>

<div id="output" class="output">Aucun document.</div>

</div>

</div>

<script>

let students=[];
let selected=null;

const base = {

lecture:{
1:{d:["décodage fragile","reconnaissance mots"],o:["identifier mots","lire syllabes"],a:["lecture guidée"]},
2:{d:["lecture lente","compréhension simple"],o:["lire phrases simples"],a:["guidage oral"]},
3:{d:["compréhension partielle"],o:["comprendre texte court"],a:["questionnement guidé"]}
},

comprehension:{
1:{d:["non repérage infos"],o:["repérer informations simples"],a:["lecture guidée"]},
2:{d:["compréhension fragile"],o:["comprendre l’essentiel"],a:["reformulation"]}
},

ecriture:{
1:{d:["tracé difficile"],o:["écrire mots"],a:["modèle"]},
2:{d:["phrases incomplètes"],o:["écrire phrases"],a:["banque de mots"]}
},

maths:{
1:{d:["numération fragile"],o:["reconnaître nombres"],a:["manipulation"]},
2:{d:["calcul lent"],o:["calcul simple"],a:["support visuel"]}
},

attention:{
1:{d:["difficulté concentration"],o:["maintenir attention"],a:["consignes courtes"]},
2:{d:["décrochage rapide"],o:["terminer tâche"],a:["fractionnement"]}
}

};

let currentSkill="";
let currentLevel="";
let selectedData={
d:[],
o:[],
a:[]
};

/* ================= ELEVE ================= */

function addStudent(){
let n=document.getElementById("name").value;
if(!n) return;
students.push(n);
document.getElementById("name").value="";
render();
}

function render(){
document.getElementById("students").innerHTML=
students.map((s,i)=>
`<div class="student ${selected===i?'active':''}" onclick="select(${i})">${s}</div>`
).join("");
}

function select(i){
selected=i;
render();
}

/* ================= ANALYSE ================= */

function loadLevelOptions(){
currentSkill=document.getElementById("skill").value;
showSuggestions();
}

function showSuggestions(){

currentLevel=document.getElementById("level").value;

if(!currentSkill || !currentLevel) return;

let data = base[currentSkill]?.[currentLevel];

if(!data) return;

/* affichage propositions */
document.getElementById("difficulties").innerHTML =
data.d.map(x=>`<label><input type="checkbox" value="${x}" onchange="update()"> ${x}</label>`).join("");

document.getElementById("objectives").innerHTML =
data.o.map(x=>`<label><input type="checkbox" value="${x}" onchange="update()"> ${x}</label>`).join("");

document.getElementById("aids").innerHTML =
data.a.map(x=>`<label><input type="checkbox" value="${x}" onchange="update()"> ${x}</label>`).join("");

}

/* ================= SELECTION ================= */

function update(){

selectedData={d:[],o:[],a:[]};

document.querySelectorAll("#difficulties input:checked").forEach(i=>selectedData.d.push(i.value));
document.querySelectorAll("#objectives input:checked").forEach(i=>selectedData.o.push(i.value));
document.querySelectorAll("#aids input:checked").forEach(i=>selectedData.a.push(i.value));

}

/* ================= PPRE ================= */

function generate(){

if(selected===null){
alert("Choisir un élève");
return;
}

let name=students[selected];

let text="PPRE – "+name+"\n\n";

text+="DIFFICULTÉS\n";
selectedData.d.forEach(x=>text+="- "+x+"\n");

text+="\nOBJECTIFS\n";
selectedData.o.forEach(x=>text+="- "+x+"\n");

text+="\nAIDES\n";
selectedData.a.forEach(x=>text+="- "+x+"\n");

text+="\nSYNTHÈSE\n";
text+="- Accompagnement ciblé selon analyse enseignant\n";

document.getElementById("output").innerText=text;

}

/* ================= FAMILLE ================= */

function generateFamily(){

let text="FICHE FAMILLE\n\n";

text+="Votre enfant bénéficie d’un accompagnement personnalisé.\n\n";

text+="Objectifs travaillés :\n";
selectedData.o.forEach(x=>text+="- "+x+"\n");

text+="\nConseils :\n- Travail régulier\n- Lecture quotidienne\n- Encouragements\n";

document.getElementById("output").innerText=text;

}

</script>

</body>
</html>
