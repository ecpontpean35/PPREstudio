<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PPRE Studio v8 – Référentiel</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f3f4f6;
}

.app{
  display:grid;
  grid-template-columns:280px 380px 1fr;
  height:100vh;
}

/* PANELS */
.panel{
  background:white;
  border-right:1px solid #e5e7eb;
  padding:12px;
  overflow:auto;
}

h2{
  font-size:12px;
  text-transform:uppercase;
  color:#6b7280;
}

/* INPUT */
input, select{
  width:100%;
  padding:8px;
  margin:4px 0;
  border:1px solid #d1d5db;
  border-radius:6px;
}

/* BUTTON */
button{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.primary{background:#2563eb;color:white;}
.secondary{background:#e5e7eb;}

/* TREE */
.tree details{
  margin:6px 0;
  padding-left:6px;
}

.tree summary{
  cursor:pointer;
  font-weight:bold;
  font-size:13px;
}

.item{
  margin:4px 0;
  padding:4px;
  border:1px solid #e5e7eb;
  border-radius:6px;
  font-size:12px;
}

/* CHECKBOX */
label{
  display:block;
  font-size:12px;
  margin:2px 0;
}

/* OUTPUT */
.output{
  white-space:pre-line;
  font-size:13px;
  padding:10px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:6px;
}

</style>
</head>

<body>

<div class="app">

<!-- ================= ELEVES ================= -->
<div class="panel">

<h2>Élèves</h2>

<input id="studentName" placeholder="Nom élève">
<button class="primary" onclick="addStudent()">Ajouter</button>

<div id="students"></div>

</div>

<!-- ================= REFERENTIEL ================= -->
<div class="panel">

<h2>Référentiel + Recherche</h2>

<input id="search" placeholder="Rechercher un item..." oninput="filterTree()">

<div class="tree" id="tree">

<!-- ===== FRANCAIS ===== -->
<details open>
<summary>Français</summary>

<details>
<summary>Lecture – Fluence</summary>

<div class="item" data-text="lecture lente fluence">
<label><input type="checkbox" onchange="selectItem(this,'lecture lente')"> lecture lente</label>
</div>

<div class="item" data-text="décodage hésitant">
<label><input type="checkbox" onchange="selectItem(this,'décodage hésitant')"> décodage hésitant</label>
</div>

</details>

<details>
<summary>Compréhension</summary>

<div class="item" data-text="compréhension implicite fragile">
<label><input type="checkbox" onchange="selectItem(this,'compréhension implicite fragile')"> compréhension implicite fragile</label>
</div>

<div class="item" data-text="repérage informations">
<label><input type="checkbox" onchange="selectItem(this,'repérage informations')"> repérage des informations</label>
</div>

</details>

</details>

<!-- ===== MATHS ===== -->
<details open>
<summary>Maths</summary>

<details>
<summary>Calcul</summary>

<div class="item" data-text="calcul lent">
<label><input type="checkbox" onchange="selectItem(this,'calcul lent')"> calcul lent</label>
</div>

<div class="item" data-text="erreurs de procédure">
<label><input type="checkbox" onchange="selectItem(this,'erreurs de procédure')"> erreurs de procédure</label>
</div>

</details>

</details>

</div>

</div>

<!-- ================= PPRE ================= -->
<div class="panel">

<h2>PPRE</h2>

<button class="primary" onclick="generate()">Générer PPRE</button>

<div class="output" id="output">Aucun PPRE.</div>

</div>

</div>

<script>

let students=[];
let selectedStudent=null;

let selectedItems=[];

/* ================= ELEVES ================= */

function addStudent(){
let n=document.getElementById("studentName").value;
if(!n) return;
students.push(n);
document.getElementById("studentName").value="";
renderStudents();
}

function renderStudents(){
document.getElementById("students").innerHTML=
students.map((s,i)=>
`<div onclick="selectedStudent=${i}" style="padding:6px;border:1px solid #ddd;margin-top:4px;cursor:pointer">${s}</div>`
).join("");
}

/* ================= ITEMS ================= */

function selectItem(el,name){

if(el.checked){
selectedItems.push(name);
}else{
selectedItems = selectedItems.filter(x=>x!==name);
}

}

/* ================= RECHERCHE ================= */

function filterTree(){

let q=document.getElementById("search").value.toLowerCase();

document.querySelectorAll(".item").forEach(el=>{
let txt=el.getAttribute("data-text");
el.style.display = txt.includes(q) ? "block":"none";
});

}

/* ================= PPRE ENGINE ================= */

const engine = {

"lecture lente":{
objectifs:[
"améliorer la fluidité de lecture",
"réduire le coût cognitif"
],
aides:[
"lecture guidée répétée",
"lecture modèle enseignant"
]
},

"décodage hésitant":{
objectifs:[
"automatiser le décodage",
"sécuriser la lecture syllabique"
],
aides:[
"travail syllabique",
"lecture assistée"
]
},

"compréhension implicite fragile":{
objectifs:[
"développer l’inférence",
"comprendre l’implicite"
],
aides:[
"questionnement guidé",
"reformulation orale"
]
},

"calcul lent":{
objectifs:[
"automatiser les faits numériques",
"fluidifier les procédures"
],
aides:[
"entraînement répétitif",
"matériel concret"
]
}

};

/* ================= GENERATION ================= */

function generate(){

if(selectedStudent===null){
alert("Choisir élève");
return;
}

let name=students[selectedStudent];

let text="PPRE – "+name+"\n\n";

text+="DIFFICULTÉS\n";
selectedItems.forEach(i=>text+="- "+i+"\n");

text+="\nOBJECTIFS\n";
selectedItems.forEach(i=>{
if(engine[i]){
engine[i].objectifs.forEach(o=>text+="- "+o+"\n");
}
});

text+="\nAIDES\n";
selectedItems.forEach(i=>{
if(engine[i]){
engine[i].aides.forEach(a=>text+="- "+a+"\n");
}
});

text+="\nVALIDATION ENSEIGNANT\n- Choix des objectifs adaptés\n- Ajustement des aides\n";

document.getElementById("output").innerText=text;

}

</script>

</body>
</html>
